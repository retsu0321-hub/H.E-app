[3,"廃棄物処理法で、廃棄物を適切に処理する責任を負うとされているのはだれ？","廃棄物を出した事業者"],
[4,"ごみを放置すると繁殖する蚊・ハエ・ゴキブリ・ネズミなどが媒介する病気をまとめて何という？","感染症"],
[4,"詰め替え用の商品を選び、容器ごみを出さないようにする。3Rのどれ？","リデュース"],
[4,"洗った牛乳びんを回収に出し、びんのまま再び使ってもらう。3Rのどれ？","リユース"],
[4,"古紙を回収に出し、トイレットペーパーの原料にする。3Rのどれ？","リサイクル"],
[5,"農地・漁場・工場などは、食品が運ばれてくるもとの何の現場？","生産や製造・加工の現場"],
[6,"保健所のほか検疫所にもいて、輸入食品の審査・検査をおこなう職員は？","食品衛生監視員"],
[7,"保健所で働く専門家を、保健師・管理栄養士のほかに2つ答えよ。","医師・歯科医師・薬剤師・看護師・歯科衛生士・食品衛生監視員 など"],
[7,"飲料水の安全や飲食店の衛生は、専門的な知識をもつ公的機関が、地域全体を対象にどのように取り組む必要がある？","組織的・広域的に"]
];
{
const U=["","大気汚染と健康","水質汚濁・土壌汚染と健康","環境と健康にかかわる対策","ごみの処理と上下水道の整備","食品の安全性と健康","食品衛生にかかわる活動","保健サービスとその活用","医療サービスとその活用"];
const pad=n=>String(n).padStart(2,"0");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Q.forEach((q,i)=>q.id=i);
const QS=Q.slice().sort((x,y)=>x[0]-y[0]||x.id-y.id);
const no=q=>pad(q[0])+"-"+pad(Q.filter(x=>x[0]===q[0]).indexOf(q)+1);
let mem={};try{mem=JSON.parse(localStorage.getItem("hoken4")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("hoken4",JSON.stringify(mem))}catch(e){}};
let units=new Set([1,2,3,4,5,6,7,8]),rand=true,weak=false,deck=[],pos=0,right=0,wrong=0,flipped=false;
const $=id=>document.getElementById(id);
function chips(){
  const all=units.size===8;
  $("chips").innerHTML=`<button class="chip" data-u="0" aria-pressed="${all}">すべて</button>`+
  U.slice(1).map((t,i)=>`<button class="chip" data-u="${i+1}" aria-pressed="${!all&&units.has(i+1)}" title="${t}">${pad(i+1)}<span class="ct"> ${t}</span></button>`).join("");
}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const u=+b.dataset.u;
  if(u===0)units=new Set([1,2,3,4,5,6,7,8]);
  else if(units.size===8)units=new Set([u]);
  else{units.has(u)?units.delete(u):units.add(u);if(!units.size)units=new Set([1,2,3,4,5,6,7,8])}
  chips();start();renderList()};
function start(){
  deck=QS.filter(q=>units.has(q[0])&&(!weak||mem[q.id]!==1));
  if(rand)for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  pos=0;right=0;wrong=0;show();stats()}
function show(){
  flipped=false;const n=deck.length;
  $("pBar").style.width=(n?pos/n*100:0)+"%";
  $("pPos").textContent=n?`${Math.min(pos+1,n)} / ${n} 問`:"";
  $("pScore").textContent=`○ ${right}　× ${wrong}`;
  if(!n){$("stage").innerHTML=`<div class="done"><b>全部○です！</b>この範囲で×の問題はありません。<br><button class="big" id="again">全問で練習する</button></div>`;
    $("again").onclick=()=>{weak=false;$("oWeak").setAttribute("aria-pressed","false");start()};return}
  if(pos>=n){const p=Math.round(right/n*100);
    $("stage").innerHTML=`<div class="done"><b>${p}%</b>${n}問中 ${right}問 正解！${p>=90?"すばらしい、テストはばっちり。":p>=60?"あと少し。×の問題をもう一度。":"×の問題からくり返そう。"}<br>
    <button class="big" id="redo">もう一度</button><button class="big ghost" id="weakgo">×の問題だけ</button></div>`;
    $("redo").onclick=start;$("weakgo").onclick=()=>{weak=true;$("oWeak").setAttribute("aria-pressed","true");start()};return}
  const q=deck[pos];
  $("stage").innerHTML=`<div class="deck"><button class="card" id="card" aria-label="カード。タップで答えを表示">
  <div class="face"><span class="tag">${no(q)}${q[3]?'<span class="plus">＋α</span>':""}</span><div class="qt">${esc(q[1])}</div><span class="hint">タップして答えを見る</span></div>
  <div class="face back"><span class="tag">${no(q)}</span><div class="at">${esc(q[2])}</div><div class="small">${esc(q[1])}</div></div></button></div>
  <div class="judge"><button class="yes" id="bY" disabled>○ わかった</button><button class="no" id="bN" disabled>× まだ</button></div>
  <div class="nav"><button id="bP">← 前の問題</button><button id="bS">とばす →</button></div>`;
  $("card").onclick=flip;$("bY").onclick=()=>judge(1);$("bN").onclick=()=>judge(0);
  $("bP").onclick=()=>{if(pos>0){pos--;show()}};$("bS").onclick=()=>{pos++;show()};
}
function flip(){flipped=!flipped;$("card").classList.toggle("flip",flipped);if(flipped){$("bY").disabled=false;$("bN").disabled=false}}
function judge(ok){const q=deck[pos];mem[q.id]=ok;save();ok?right++:wrong++;pos++;show();stats()}
document.addEventListener("keydown",e=>{if($("play").hidden||e.target.tagName==="INPUT")return;
  if(e.key===" "||e.key==="Enter"){if($("card")){e.preventDefault();flip()}}
  else if(flipped&&(e.key==="ArrowRight"||e.key==="o"))judge(1);else if(flipped&&(e.key==="ArrowLeft"||e.key==="x"))judge(0)});
function stats(){
  $("stats").innerHTML=U.slice(1).map((t,i)=>{const qs=Q.filter(q=>q[0]===i+1),k=qs.filter(q=>mem[q.id]===1).length;
  return `<div class="st"><b>${pad(i+1)}</b> ${t}<br>${k} / ${qs.length}<div class="bar"><i style="width:${k/qs.length*100}%"></i></div></div>`}).join("")}
$("oRand").onclick=e=>{rand=!rand;e.currentTarget.setAttribute("aria-pressed",rand);start()};
$("oWeak").onclick=e=>{weak=!weak;e.currentTarget.setAttribute("aria-pressed",weak);start()};
let armed=false;$("oReset").onclick=e=>{const b=e.currentTarget;
  if(!armed){armed=true;b.textContent="もう一度押すとリセット";setTimeout(()=>{armed=false;b.textContent="記録をリセット"},3000);return}
  mem={};save();armed=false;b.textContent="記録をリセット";start()};
function renderList(){const w=$("q").value.trim();
  const qs=QS.filter(q=>units.has(q[0])&&(!w||q[1].includes(w)||q[2].includes(w)));
  let html="",cur=0;
  qs.forEach(q=>{if(q[0]!==cur){cur=q[0];html+=`<h2>${pad(cur)} ${U[cur]}</h2>`}
    html+=`<li><span class="no">${no(q)}</span><span>${esc(q[1])}${q[3]?'<span class="plus">＋α</span>':""}</span><span class="a">${esc(q[2])}</span></li>`});
  $("ul").innerHTML=html||"<li><span></span><span>見つかりませんでした。</span></li>"}
$("q").oninput=renderList;
$("ul").onclick=e=>{const a=e.target.closest(".a");if(a)a.classList.toggle("show")};
$("oHide").onclick=e=>{const h=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",h);$("ul").classList.toggle("hide",h)};
function tab(p){$("tPlay").setAttribute("aria-selected",p);$("tList").setAttribute("aria-selected",!p);$("play").hidden=!p;$("list").hidden=p}
$("tPlay").onclick=()=>tab(true);$("tList").onclick=()=>tab(false);
$("qCount").textContent="全"+Q.length+"問";
chips();start();renderList();
}
</script></body></html>
